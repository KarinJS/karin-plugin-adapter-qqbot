name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 构建适配器
        run: pnpm build

      - name: 构建文档
        run: pnpm docs:build

      - name: 测试
        run: pnpm test
